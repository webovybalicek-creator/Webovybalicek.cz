name: Jednorázově smazat starý WordPress (ostrý FTP)

on:
  workflow_dispatch:

jobs:
  uklid:
    runs-on: ubuntu-latest
    if: github.event.repository.name == 'webovybalicek.cz'
    steps:
      - name: Smazat soubory WordPressu
        env:
          H: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq lftp >/dev/null
          lftp -u "$U","$P" -e "set ssl:verify-certificate no; \
            rm -r wp-admin wp-content wp-includes; \
            rm index.php license.txt readme.html error_log xmlrpc.php wp-config.php wp-config-sample.php \
               wp-activate.php wp-blog-header.php wp-comments-post.php wp-cron.php wp-links-opml.php wp-load.php \
               wp-login.php wp-mail.php wp-settings.php wp-signup.php wp-trackback.php; \
            cls -1aF; bye" "$H"
