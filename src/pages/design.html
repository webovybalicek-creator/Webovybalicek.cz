<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>design · webovybalicek</title>
  <link rel="icon" href="/assets/img/favicon.svg?v=2" type="image/svg+xml">
  <link rel="preload" href="/assets/fonts/Geist-latin.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Geist"; src: url("/assets/fonts/Geist-latin.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    @font-face { font-family: "Geist"; src: url("/assets/fonts/Geist-latin-ext.woff2") format("woff2"); font-weight: 100 900; font-display: swap; unicode-range: U+0100-024F, U+1E00-1EFF; }

    :root {
      --ink: #0a1217; --paper: #fff; --gray: #f4f4f4; --line: #e9eaeb;
      --stone: #85898b; --graphite: #54595d; --lime: #cdfe00;
      --ease: cubic-bezier(0.23, 1, 0.32, 1);
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    html { -webkit-font-smoothing: antialiased; }
    body { margin: 0; font: 15px/1.5 "Geist", ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: var(--paper); }
    a { color: inherit; text-decoration: none; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 56px 24px 96px; }

    header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
    h1 { margin: 0; font-size: 28px; font-weight: 600; letter-spacing: -0.03em; }
    h1 span { display: inline-block; width: 10px; height: 10px; margin-left: 4px; border-radius: 50%; background: var(--lime); }
    .meta { font: 12px var(--mono); color: var(--stone); }

    .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 8px; }
    .tabs { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--gray); }
    .tabs button { font: inherit; font-size: 14px; border: 0; padding: 6px 14px; border-radius: 999px; background: transparent; color: var(--graphite); cursor: pointer;
      transition: background-color 150ms var(--ease), color 150ms var(--ease), transform 150ms var(--ease); }
    .tabs button[aria-selected="true"] { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(10,18,23,.12); }
    .tabs button:active { transform: scale(0.97); }
    .tabs sup { font: 10px var(--mono); color: var(--stone); margin-left: 3px; }

    .search { flex: 1; min-width: 200px; position: relative; }
    .search input { width: 100%; font: inherit; font-size: 14px; padding: 8px 36px 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); outline: none;
      transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease); }
    .search input:focus { border-color: var(--ink); box-shadow: 0 0 0 3px rgba(205,254,0,.55); }
    .search kbd { position: absolute; right: 10px; top: 50%; translate: 0 -50%; font: 11px var(--mono); color: var(--stone); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; pointer-events: none; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 8px; }
    .chips button { font: 12px var(--mono); border: 1px solid var(--line); background: var(--paper); color: var(--graphite); padding: 3px 10px; border-radius: 999px; cursor: pointer;
      transition: background-color 150ms var(--ease), border-color 150ms var(--ease), transform 150ms var(--ease); }
    .chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
    .chips button:active { transform: scale(0.97); }

    ul.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
    .list li { border-bottom: 1px solid var(--line); }
    .list a { display: grid; grid-template-columns: 180px 1fr auto; align-items: baseline; gap: 20px; padding: 14px 8px; margin: 0 -8px; border-radius: 8px;
      transition: background-color 150ms var(--ease); }
    .list .name { font-weight: 550; letter-spacing: -0.01em; }
    .list .name em { font-style: normal; font: 10px var(--mono); color: var(--ink); background: var(--lime); padding: 1px 5px; border-radius: 4px; margin-left: 6px; vertical-align: 2px; }
    .list .desc { color: var(--graphite); font-size: 14px; }
    .list .host { font: 12px var(--mono); color: var(--stone); white-space: nowrap; }
    .list .host::after { content: " ↗"; opacity: 0; transition: opacity 150ms var(--ease); }
    .list a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    @media (hover: hover) and (pointer: fine) {
      .list a:hover { background: var(--gray); }
      .list a:hover .host::after { opacity: 1; }
      .tabs button:not([aria-selected="true"]):hover, .chips button:not([aria-pressed="true"]):hover { color: var(--ink); border-color: var(--stone); }
    }
    .empty { padding: 40px 0; color: var(--stone); font-size: 14px; }

    @media (max-width: 640px) {
      .wrap { padding-top: 32px; }
      .list a { grid-template-columns: 1fr auto; gap: 2px 12px; }
      .list .desc { grid-column: 1 / -1; grid-row: 2; }
    }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>design<span aria-hidden="true"></span></h1>
    <span class="meta">osobní · neindexováno</span>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <label class="search">
      <input type="search" id="q" placeholder="Hledat…" autocomplete="off" aria-label="Hledat">
      <kbd>/</kbd>
    </label>
  </div>
  <div class="chips" id="chips"></div>
  <ul class="list" id="list"></ul>
  <p class="empty" id="empty" hidden>Nic nenalezeno.</p>
</div>

<script>
/* ─────────────────────────────────────────────────────────────
   DATA – novou záložku přidáš novým klíčem, položku novým řádkem.
   tags: libovolné štítky (z nich se skládají filtry)
   pick: true = oblíbené (limetkový štítek)
   ───────────────────────────────────────────────────────────── */
const DATA = {
  "Libraries": [
    { name: "shadcn/ui", url: "https://ui.shadcn.com", desc: "Komponenty, které si zkopíruješ do projektu a vlastníš kód. Radix/Base UI + Tailwind.", tags: ["Komponenty"], pick: true },
    { name: "Base UI", url: "https://base-ui.com", desc: "Nestylované, přístupné primitivy od autorů Radixu a MUI. Styl je jen na tobě.", tags: ["Primitivy"] },
    { name: "Radix", url: "https://www.radix-ui.com", desc: "Headless primitivy (dialog, popover, tabs…) s řešenou přístupností. Plus Radix Colors.", tags: ["Primitivy"] },
    { name: "Sonner", url: "https://sonner.emilkowal.ski", desc: "Toast notifikace od Emila Kowalského – výchozí volba pro hlášky typu „Uloženo“.", tags: ["Komponenty", "Emil"], pick: true },
    { name: "Vaul", url: "https://vaul.emilkowal.ski", desc: "Drawer (spodní šuplík) s přirozeným tažením – hlavně pro mobil.", tags: ["Komponenty", "Emil"] },
    { name: "cmdk", url: "https://cmdk.paco.me", desc: "Command menu (⌘K) – rychlé hledání a příkazy.", tags: ["Komponenty"] },
    { name: "NumberFlow", url: "https://number-flow.barvian.me", desc: "Animované přechody čísel – ceny, počítadla, statistiky.", tags: ["Animace"] },
    { name: "pick-ui-library skill", url: "https://github.com/emilkowalski/skills", desc: "Skill od Emila: pomůže vybrat správnou UI knihovnu pro konkrétní případ.", tags: ["Skill", "Emil"] },
    { name: "Beautiful UI", url: "https://beautifului.dev", desc: "Sbírka pěkně zpracovaných UI komponent a detailů.", tags: ["Galerie"] },
    { name: "RareUI", url: "https://rareui.in", desc: "Méně obvyklé, efektní komponenty – na oživení.", tags: ["Galerie", "Efekty"] },
    { name: "Magic UI", url: "https://magicui.design", desc: "Animované komponenty pro landing pages (React + Tailwind + Motion).", tags: ["Efekty", "Animace"] },
    { name: "Aceternity UI", url: "https://ui.aceternity.com", desc: "Efektní bloky a pozadí pro hero sekce. Opatrně – snadno z toho je „AI slop“.", tags: ["Efekty"] },
    { name: "21st.dev", url: "https://21st.dev", desc: "Komunitní registr React komponent, instalace jedním příkazem přes shadcn CLI.", tags: ["Galerie", "Komponenty"] }
  ],
  "Appky": [
    { name: "Mobbin", url: "https://mobbin.com", desc: "Knihovna screenshotů a celých flow ze skutečných aplikací a webů – inspirace pro UI.", tags: ["Inspirace"] },
    { name: "Granola", url: "https://go.granola.ai", desc: "AI poznámky ze schůzek – přepis a shrnutí bez bota v hovoru.", tags: ["AI", "Produktivita"] },
    { name: "Anything", url: "https://anything.link", desc: "AI builder: z popisu v běžné řeči udělá mobilní appku, web nebo nástroj.", tags: ["AI", "Builder"] }
  ]
};

const $ = (s) => document.querySelector(s);
const tabsEl = $("#tabs"), chipsEl = $("#chips"), listEl = $("#list"), q = $("#q"), emptyEl = $("#empty");
const tabNames = Object.keys(DATA);
let tab = decodeURIComponent(location.hash.slice(1)) || tabNames[0];
if (!DATA[tab]) tab = tabNames[0];
let tag = "";

const host = (u) => u.replace(/^https?:\/\/(www\.)?/, "").replace(/\/$/, "");
const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function renderTabs() {
  tabsEl.innerHTML = tabNames.map((t) =>
    `<button role="tab" aria-selected="${t === tab}" data-tab="${esc(t)}">${esc(t)}<sup>${DATA[t].length}</sup></button>`).join("");
}
function renderChips() {
  const tags = [...new Set(DATA[tab].flatMap((i) => i.tags || []))].sort((a, b) => a.localeCompare(b, "cs"));
  chipsEl.innerHTML = ["", ...tags].map((t) =>
    `<button type="button" aria-pressed="${t === tag}" data-tag="${esc(t)}">${t ? esc(t) : "Vše"}</button>`).join("");
}
function renderList() {
  const term = norm(q.value.trim());
  const items = DATA[tab].filter((i) =>
    (!tag || (i.tags || []).includes(tag)) &&
    (!term || norm(`${i.name} ${i.desc} ${i.url} ${(i.tags || []).join(" ")}`).includes(term)));
  listEl.innerHTML = items.map((i) => `
    <li><a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">
      <span class="name">${esc(i.name)}${i.pick ? "<em>oblíbené</em>" : ""}</span>
      <span class="desc">${esc(i.desc || "")}</span>
      <span class="host">${esc(host(i.url))}</span>
    </a></li>`).join("");
  emptyEl.hidden = items.length > 0;
}
function render() { renderTabs(); renderChips(); renderList(); }

tabsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-tab]"); if (!b) return;
  tab = b.dataset.tab; tag = ""; history.replaceState(null, "", "#" + encodeURIComponent(tab)); render();
});
chipsEl.addEventListener("click", (e) => {
  const b = e.target.closest("[data-tag]"); if (!b) return;
  tag = b.dataset.tag; renderChips(); renderList();
});
q.addEventListener("input", renderList);
document.addEventListener("keydown", (e) => {
  if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  if (e.key === "Escape" && document.activeElement === q) { q.value = ""; renderList(); q.blur(); }
});
render();
</script>
</body>
</html>
