name: Snímky referencí

on:
  workflow_dispatch:
    inputs:
      jen:
        description: "Jen tyto weby (slugy oddělené mezerou, např. dorsen-cz facer-cz); prázdné = všechny"
        required: false
  push:
    branches: [main]
    paths: [src/data/reference-weby.json]

permissions:
  contents: write

jobs:
  snimky:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install playwright pillow && python -m playwright install --with-deps chromium
      - run: python tools/snimky.py ${{ github.event.inputs.jen }}
      - name: Uložit do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/reference src/data/reference-snimky.json
          git diff --cached --quiet || git commit -m "Snímky referencí (automaticky)"
          git pull --rebase origin main && git push
