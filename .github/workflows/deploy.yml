name: Deploy na FTP

on:
  push:
    branches: [main]
  workflow_dispatch:
  # po doběhnutí náhledů pro /design/ (commit od bota sám deploy nespustí)
  workflow_run:
    workflows: ["Náhledy /design/"]
    types: [completed]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: python3 build.py

      - name: Neveřejný slevový kód (ze secretu, není v repozitáři)
        env:
          SLEVA_KOD: ${{ secrets.SLEVA_KOD }}
        run: printf '<?php $CODE = %s;\n' "$(python3 -c 'import json,os;print(json.dumps(os.environ["SLEVA_KOD"]))')" > dist/sleva-config.php

      - name: Nahrát na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: ./
