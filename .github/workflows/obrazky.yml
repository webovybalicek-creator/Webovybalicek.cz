name: Stáhnout obrázky

on:
  workflow_dispatch:
    inputs:
      obrazky:
        description: "Dvojice URL=>cesta oddělené mezerou (např. https://…/a.jpg=>assets/img/x/a.webp)"
        required: true

permissions:
  contents: write

jobs:
  stahnout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stáhnout
        env:
          OBRAZKY: ${{ github.event.inputs.obrazky }}
        run: pip install pillow && python tools/stahni.py
      - name: Uložit do repozitáře
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img
          git diff --cached --quiet || git commit -m "Stažené obrázky (automaticky)"
          git pull --rebase origin main && git push
